<html lang="es"><head><meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a2420">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cartel SAR">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartel SAR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fff;--sf:#f3f5f0;--tx:#1c2118;--mu:#5d6657;--bd:#d3d9cc;--ac:#2f7d32}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14180f;--sf:#1e2418;--tx:#e8ecdf;--mu:#9aa592;--bd:#343c2c;--ac:#7cc47f}}
:root[data-theme="dark"]{--bg:#14180f;--sf:#1e2418;--tx:#e8ecdf;--mu:#9aa592;--bd:#343c2c;--ac:#7cc47f}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Arial,sans-serif;padding:14px;max-width:1100px;margin:auto}
h1{font-size:20px;margin:0 0 10px}h2{font-size:15px;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:900px){.grid{grid-template-columns:1fr 440px}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
label{font-size:12px;color:var(--mu);display:block}
input,select{width:100%;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.r{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px}
.r>div{grid-column:span 3}.r>.s2{grid-column:span 2}.r>.s6{grid-column:span 6}
button{padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--bd)}
.note{font-size:12px;color:var(--mu)}
.sticky{position:sticky;top:8px}
</style></head><body>
<h1>Cartel «Xogamos na casa»</h1>
<div class="grid"><div>
<div class="row" style="margin-bottom:10px"><button id="bc" class="p" onclick="tab('c')">Cartel</button><button id="bi" onclick="tab('i')">Importar Excel</button><button id="bs" onclick="tab('s')">Pantalla</button><button id="bf" onclick="tab('f')">Afición</button></div>
<div id="tabC">
<div class="card"><div class="r">
<div><label>Fecha sábado</label><input id="ds" value="10 OUT."></div>
<div><label>Fecha domingo</label><input id="dd" value="11 OUT."></div>
<div class="s6"><label>Tipo de cartel</label><select id="pmode" onchange="draw()"><option value="h">En casa (XOGAMOS NA CASA)</option><option value="a">Fuera (XOGAMOS FÓRA)</option></select></div>
<div class="s6"><label>Pabellón</label><input id="venue" value="PAVILLÓN A BOMBONERA"></div>
<div class="s6"><label style="display:flex;gap:6px;align-items:center;color:var(--tx)"><input type="checkbox" id="hidef" style="width:auto" onchange="draw()"> No repetir en las tablas los partidos con cuadro verde</label></div></div>
<div class="r">
<div><label>Escudo SAR</label><input type="file" accept="image/*" data-k="crest"></div>
<div><label>Fondo (opcional)</label><input type="file" accept="image/*" data-k="bg"></div>
<div class="s6"><label>Franja de patrocinadores (opcional, ancho 1080×130)</label><input type="file" accept="image/*" data-k="spons"></div></div></div>
<h2>Partidos <span class="note">(marca ★ para el cuadro verde, máx. 4)</span></h2>
<div id="list"></div>
<div class="row"><button onclick="add()">+ Añadir partido</button><button onclick="reset()">Restaurar ejemplo</button></div>
</div>
<div id="tabF" hidden></div>
<div id="tabI" hidden>
<div class="card"><label>Excel de la federación (.xlsx, .xls o .csv)</label><input type="file" id="xf" accept=".xlsx,.xls,.csv"><div id="shw" style="margin-top:6px"></div></div>
<div class="card"><div class="r"><div><label>Sábado del fin de semana</label><input type="date" id="isat"></div>
<div><label>Equipos (separados por coma)</label><input id="iteams" value="SAR"></div>
<div class="s6"><label>Tipo de cartel</label><select id="imode"><option value="h">Partidos en casa (el equipo es local)</option><option value="a">Partidos fuera (el equipo es visitante)</option></select></div>
<div><label>Equipos masculinos (palabras)</label><input id="imasc" value="OPMOBILITY, GLOBALMAR"></div>
<div><label>Equipos femeninos (palabras)</label><input id="ifem" value="IMPERNOROESTE, RODAVIGO"></div>
<div class="s6 note" id="iwk"></div></div>
<div id="imap" class="r"></div></div>
<h2>Partidos encontrados <span class="note">(★ = cuadro verde, ✕ = quitar: aplazado, etc.)</span></h2>
<div id="ires"><div class="note">Carga el Excel para ver los partidos.</div></div>
<div class="row"><button class="p" onclick="useImp()">Usar en el cartel →</button><span class="note" id="imsg"></span></div>
</div>
<div id="tabS" hidden>
<div class="card"><div class="r">
<div class="s6"><label>Contenido de la pantalla</label><select id="smode" onchange="smodeChg()"><option value="img">Carteles del club (imágenes de redes)</option><option value="gen">Cartel generado con los partidos</option></select></div>
<div><label>Ancho pantalla (m)</label><input id="sw" type="number" step="0.01" value="3.10" oninput="wideDraw()"></div>
<div><label>Alto pantalla (m)</label><input id="sh" type="number" step="0.01" value="1.80" oninput="wideDraw()"></div>
<div class="s6"><label>Calidad</label><select id="sres"><option value="1080">Normal (alto 1080 px, recomendada para WhatsApp)</option><option value="1800">Alta (alto 1800 px)</option></select></div></div></div>
<div id="simg"><div class="card"><label>Carteles del club, los de redes (el orden es el de la lista)</label><input type="file" id="pf" multiple accept="image/*"><div id="plist"></div></div></div>
<div id="sgen" hidden><div class="card note">Se genera con el diseño de la herramienta. Marca los partidos que quieras que salgan.</div><div id="slist"></div></div>
<div class="card"><canvas id="cw" width="775" height="450"></canvas>
<div class="row" style="margin-top:8px"><button class="p" onclick="wsave()">Descargar PNG</button><button onclick="wshare()">Compartir por WhatsApp</button></div>
<div class="row" id="sepb" style="margin-top:6px"><button onclick="wsave(1)">Descargar cada cartel por separado</button><button onclick="wshare(1)">Compartir por separado</button></div>
<div class="note" id="wmsg" style="margin-top:6px"></div></div>
</div>
</div>
<div class="sticky"><canvas id="cv" width="1080" height="1350"></canvas>
<div class="row" style="margin-top:8px"><button class="p" onclick="dl()">Descargar PNG</button><span class="note" id="msg"></span></div></div></div>

async function unzip(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw 0;

for(let i=0;i<n&&dv.getUint32(p,true)===0x02014b50;i++){const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true),name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));
const o=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);F[name]={meth,d:u.subarray(o,o+cs)};p+=46+nl+xl+cl}
const get=async k=>{const f=F[k];if(!f)return null;let b=f.d;if(f.meth===8)b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());return new TextDecoder().decode(b)};
return {F,get}}

let sst=[];const ss=await get('xl/sharedStrings.xml');if(ss)sst=[...dom(ss).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
const rows=[];for(const c of dom(await get(sh)).getElementsByTagName('c')){const ref=c.getAttribute('r')||'',ri=+ref.replace(/\D/g,'')-1;let ci=0;for(const ch of ref.replace(/\d/g,''))ci=ci*26+ch.charCodeAt(0)-64;ci--;
const t=c.getAttribute('t');let v='';if(t==='inlineStr')v=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
else{const ve=c.getElementsByTagName('v')[0];if(ve){v=ve.textContent;if(t==='s')v=sst[+v]||'';else if(!t||t==='n')v=parseFloat(v)}}
(rows[ri]=rows[ri]||[])[ci]=v}
return Array.from(rows,r=>r?Array.from(r,x=>x===undefined?'':x):[])}
